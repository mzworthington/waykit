name: Waykit CI

# Verify (merge gate) → Promote (tag + changelog) on green main.
# Side cadences stay separate: CodeQL, nightly live EDD, Pages (path-filtered).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# C4: Restrict GITHUB_TOKEN to read-only by default; Promote elevates contents: write.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tgz
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm wk commit-msg --message "$PR_TITLE"

      - name: TypeScript type-check
        run: pnpm typecheck && pnpm --dir web typecheck

      - name: Build static site
        env:
          POSTHOG_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.POSTHOG_TOKEN || '' }}
          POSTHOG_HOST: ${{ github.ref == 'refs/heads/main' && 'https://a.mzworthington.co.uk' || '' }}
        run: pnpm --dir web build

      - name: Unit tests
        run: pnpm test:ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_API_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.organization=${{ vars.SONARQUBE_ORG }}

      - name: Kit quality gate
        run: pnpm wk check

      - name: Repo doctor
        run: pnpm wk doctor .

      - name: Test MCP Profile Composition
        run: pnpm wk mcp default

      - name: Test kit CLI Executable
        run: pnpm wk metrics

      - name: Publish Verify job summary
        if: always()
        run: |
          {
            echo "## Verify"
            echo ""
            echo "Merge gate for the kit. Scripted EDD suites run inside \`wk check\`"
            echo "(no separate Agent EDD Suite workflow)."
            echo ""
            echo "| Gate | What a green check means |"
            echo "|------|--------------------------|"
            echo "| actionlint | Workflow YAML is valid and Action-safe |"
            echo "| typecheck / unit tests | TypeScript and Node harness tests pass |"
            echo "| wk check | Skill security scan, layout, IDE rules export, skill-trigger evals, EDD routing ≥95% (architecture + model class + kit-knowledge + Cloudflare ops + safety + recovery), context budget |"
            echo "| wk doctor | This checkout has README, license, contributing, security, and GitHub templates |"
            echo "| MCP profile / wk metrics | Default MCP composition resolves; CLI metrics command runs |"
            echo ""
            echo "On \`main\`, a green Verify unlocks the **Promote** job (GitHub Release + changelog push)."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f out/reports/unit-test-report.md ]; then
            cat out/reports/unit-test-report.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No unit test report was produced._" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f out/reports/edd-report.json ]; then
            pnpm wk eval report --format md --out out/reports --from out/reports/edd-report.json --github-summary
          else
            echo "_No EDD report artifacts were produced (wk check may have failed earlier)._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload EDD reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edd-eval-reports-ci
          path: out/reports/
          if-no-files-found: warn

  promote:
    name: Promote
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect release
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bin/release.sh detect

      - name: Publish GitHub Release
        if: steps.detect.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bin/release.sh publish "${{ steps.detect.outputs.tag }}" "${{ steps.detect.outputs.since }}"

      - name: Sync release notes for all version tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force
          bash bin/release.sh sync-notes

      - name: Commit changelog if changed
        run: bash bin/release.sh commit-changelog

      - name: Publish Promote job summary
        if: always()
        env:
          RELEASE: ${{ steps.detect.outputs.release }}
          TAG: ${{ steps.detect.outputs.tag }}
          BUMP: ${{ steps.detect.outputs.bump }}
        run: |
          {
            echo "## Promote"
            echo ""
            echo "Runs only after green **Verify** on \`main\` (or \`workflow_dispatch\`)."
            echo "Cuts a GitHub Release from conventional commits, syncs version-scoped"
            echo "notes on all \`v*\` releases, then regenerates date-grouped"
            echo "\`CHANGELOG.md\` on the latest tip (retry push once; never force-push)."
            echo "Consumers pin with \`wk _REF=vX.Y.Z\`."
            echo ""
            if [ "${RELEASE}" = "true" ]; then
              echo "- **Released:** \`${TAG}\` (bump=\`${BUMP}\`)"
            else
              echo "- **No release cut** (docs/chore-only, or HEAD is a derived commit)."
            fi
            echo "- **Release notes:** synced for all existing \`vX.Y.Z\` tags"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
