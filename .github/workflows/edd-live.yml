name: Weekly live-model EDD

# Scripted CI proves the harness. This job runs paraphrase / prompt-injection /
# multi-tool cases tagged `requires-live` against Cursor Agent CLI.
#
# Do not use `secrets` in job-level `if:` - that context is not available there
# and GitHub rejects the workflow file (red X on the introducing commit).
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live-model EDD
    runs-on: ubuntu-latest
    steps:
      - name: Check live-eval credentials
        id: creds
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          KIT_EVAL_MODEL: ${{ vars.KIT_EVAL_MODEL }}
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "CURSOR_API_KEY is not set; skipping live-model EDD. Scripted CI remains the merge gate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Weekly live-model EDD"
              echo ""
              echo "Skipped: \`CURSOR_API_KEY\` is not configured."
              echo "Scripted PR CI (\`wk check\` in Verify) remains the merge gate."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "model=${KIT_EVAL_MODEL:-cursor-grok-4.6-medium}" >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        if: steps.creds.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Install pnpm
        if: steps.creds.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        if: steps.creds.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        if: steps.creds.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Cursor CLI
        if: steps.creds.outputs.skip != 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run live EDD suites (includes requires-live)
        if: steps.creds.outputs.skip != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          KIT_EVAL_MODEL: ${{ steps.creds.outputs.model }}
        run: |
          mkdir -p out/reports
          pnpm wk eval ci \
            --suite evals/edd/architecture_routing.yaml \
            --style cli --cli cursor-agent \
            --model "${KIT_EVAL_MODEL}" \
            --threshold-routing 95 \
            --out out/reports
          pnpm wk eval ci \
            --suite evals/edd/kit_knowledge.yaml \
            --style cli --cli cursor-agent \
            --model "${KIT_EVAL_MODEL}" \
            --threshold-routing 95 \
            --out out/reports
          pnpm wk eval ci \
            --suite evals/edd/model_routing.yaml \
            --style cli --cli cursor-agent \
            --model "${KIT_EVAL_MODEL}" \
            --threshold-routing 95 \
            --out out/reports
          pnpm wk eval ci \
            --suite evals/edd/cloudflare_ops.yaml \
            --style cli --cli cursor-agent \
            --model "${KIT_EVAL_MODEL}" \
            --threshold-routing 95 \
            --out out/reports
          pnpm wk eval ci \
            --suite evals/edd/safety.yaml \
            --style cli --cli cursor-agent \
            --model "${KIT_EVAL_MODEL}" \
            --threshold-routing 95 \
            --out out/reports

      - name: Publish live EDD job summary
        if: always() && steps.creds.outputs.skip != 'true'
        env:
          KIT_EVAL_MODEL: ${{ steps.creds.outputs.model }}
        run: |
          {
            echo "## Weekly live-model EDD"
            echo ""
            echo "Proves paraphrase / prompt-injection / multi-tool cases tagged \`requires-live\`"
            echo "against **\`${KIT_EVAL_MODEL}\`** via \`cursor-agent\` (\`CURSOR_API_KEY\`)."
            echo "This is not the PR merge gate - Verify (\`wk check\`) is."
            echo ""
            echo "| Suite | Live focus |"
            echo "|-------|------------|"
            echo "| architecture_routing | Real-model tool selection under paraphrase |"
            echo "| kit_knowledge | Live kit-knowledge MCP routing |"
            echo "| model_routing | Live plan/review/implement/cheap class selection |"
            echo "| cloudflare_ops | Live Cloudflare RUM / observability MCP routing |"
            echo "| safety | Injection + no-tool refusal under a live model |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f out/reports/edd-report.json ]; then
            pnpm wk eval report --format md --out out/reports --from out/reports/edd-report.json --github-summary
          else
            echo "_No EDD report JSON was produced._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload EDD report artifacts
        if: always() && steps.creds.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: edd-live-eval-reports
          path: out/reports/
          if-no-files-found: warn
