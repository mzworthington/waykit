name: Deploy GitHub Pages Documentation

# Custom domain DNS (apex A/AAAA + www CNAME) is owned by edge-dns:
# https://github.com/mzworthington/edge-dns/blob/main/docs/github-pages-origin.md
#
# Path-filtered so changelog/release bot commits and kit-only changes do not
# redeploy the docs site. Manual dispatch still works.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'assets/**'
      - 'ontology/**'
      - 'kit/src/ontology/**'
      - 'skills/**'
      - 'SOPs/**'
      - 'mcps/catalog.json'
      - 'evals/**'
      - 'CODING_PHILOSOPHY.md'
      - 'docs/**'
      - 'kit/src/site/**'
      - 'llms.txt'
      - 'robots.txt'
      - '.nojekyll'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: https://waykit.dev
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
      POSTHOG_HOST: https://a.mzworthington.co.uk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive ontology index for the homepage
        run: pnpm wk ontology generate

      - name: Build Markdown docs site
        run: pnpm --dir web build

      - name: Assemble public Pages tree
        run: pnpm wk site assemble

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Publish deploy job summary
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Deploy GitHub Pages"
            echo ""
            echo "Publishes a curated Pages tree (landing, public Markdown, assets) - not the whole repo."
            echo "Runs on docs-site path changes only (or \`workflow_dispatch\`)."
            echo "Custom domain DNS is owned by [edge-dns](https://github.com/mzworthington/edge-dns)."
            echo ""
            if [ -n "${PAGE_URL}" ]; then
              echo "- **Deployment URL:** ${PAGE_URL}"
            fi
            echo "- **Canonical site:** https://waykit.dev"
            echo ""
            echo "A green check means the Pages artifact uploaded and the environment deployment finished."
          } >> "$GITHUB_STEP_SUMMARY"
