<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Waykit implementation and eval loops</title>
  <desc id="desc">
    Nested implementation loops: PDLC outside, SDLC in the middle, TDD at the centre.
    Eval suite beside the loops. Outside pressure (market, users, tech, compliance) sits to the right.
  </desc>
  <style>
    .sans { font-family: 'IBM Plex Sans', Helvetica Neue, Helvetica, Arial, sans-serif; }
  </style>

  <line x1="596" y1="44" x2="596" y2="436" stroke="rgba(12,18,16,0.1)" stroke-width="1" />
  <line x1="876" y1="44" x2="876" y2="436" stroke="rgba(12,18,16,0.1)" stroke-width="1" />

  <g class="sans" letter-spacing="0em">
    <text x="300" y="32" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="600" letter-spacing="0.14em">IMPLEMENTATION</text>
    <text x="736" y="32" text-anchor="middle" fill="#8a7a66" font-size="11" font-weight="600" letter-spacing="0.14em">EVAL</text>
    <text x="998" y="32" text-anchor="middle" fill="#5b6662" font-size="11" font-weight="600" letter-spacing="0.14em">OUTSIDE</text>

    <g fill="none" stroke="#0f766e" stroke-linecap="round">
      <ellipse cx="300" cy="258" rx="248" ry="168" stroke-width="1.4" stroke-dasharray="7 10" opacity="0.5" />
      <ellipse cx="300" cy="258" rx="170" ry="114" stroke-width="1.55" stroke-dasharray="5 8" opacity="0.78" />
      <ellipse cx="300" cy="258" rx="82" ry="58" stroke-width="2" />
    </g>
    <ellipse cx="300" cy="258" rx="82" ry="58" fill="rgba(15,118,110,0.07)" stroke="none" />

    <g text-anchor="middle" font-size="12" font-weight="500" fill="#0c1412">
      <text x="300" y="72">Discovery and requirements</text>
      <text x="300" y="122">Design and architecture</text>
      <text x="300" y="348">CI/CD</text>
      <text x="300" y="402">Product metrics</text>
    </g>

    <g transform="translate(300 258)">
      <circle r="32" fill="#0f766e" />
      <text y="5" text-anchor="middle" fill="#f3efe6" font-size="13" font-weight="600">TDD</text>
    </g>

    <text x="628" y="168" fill="#0c1412" font-size="15" font-weight="600">Eval suite</text>
    <text x="628" y="190" fill="#0f766e" font-size="12">wk eval ci</text>
    <g font-size="13" font-weight="500" fill="#1c2422">
      <text x="628" y="242">Golden datasets</text>
      <text x="628" y="276">Unit and E2E</text>
      <text x="628" y="310">Routing evals</text>
      <text x="628" y="344">Drift detection</text>
    </g>

    <g font-size="13" font-weight="500" fill="#3d4a47">
      <text x="906" y="242">Market</text>
      <text x="906" y="276">Users</text>
      <text x="906" y="310">Tech</text>
      <text x="906" y="344">Compliance</text>
    </g>
  </g>
</svg>
