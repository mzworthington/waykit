<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Waykit value loop</title>
  <desc id="desc">
    Forward phases Grill through Ship form the quality bar. A Learn return path feeds
    evals, quality loops and the work picker back into the next session. High-quality
    code sits at the centre as the outcome.
  </desc>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#2dd4bf" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#5eead4" stop-opacity="1" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="learn" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#2dd4bf" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#090a0d" stop-opacity="0" />
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8.5 5 L0 8.8 Z" fill="#2dd4bf" />
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#090a0d" />
  <rect width="1200" height="520" fill="url(#glow)" />

  <g opacity="0.07" stroke="#e8eaee" stroke-width="1">
    <path d="M60 60 H1140 M60 140 H1140 M60 220 H1140 M60 300 H1140 M60 380 H1140 M60 460 H1140" />
    <path d="M120 20 V500 M240 20 V500 M360 20 V500 M480 20 V500 M600 20 V500 M720 20 V500 M840 20 V500 M960 20 V500 M1080 20 V500" />
  </g>

  <path
    d="M140 160 C220 78, 980 78, 1060 160"
    fill="none"
    stroke="url(#rail)"
    stroke-width="3.5"
    stroke-linecap="round"
    marker-end="url(#arrow)"
  />

  <path
    d="M1060 160 C1120 250, 1120 360, 980 400 C720 465, 480 465, 220 400 C80 360, 80 250, 140 160"
    fill="none"
    stroke="url(#learn)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="8 10"
  />

  <g transform="translate(600 285)">
    <circle r="78" fill="#0e1015" stroke="rgba(45,212,191,0.28)" stroke-width="1.5" />
    <circle r="92" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.35" />
    <g transform="translate(-24 -40) scale(0.75)" aria-hidden="true">
      <polygon
        fill="none"
        stroke="#2dd4bf"
        stroke-width="2.25"
        stroke-linejoin="round"
        points="32,7 53.95,19.75 53.95,44.25 32,57 10.05,44.25 10.05,19.75"
      />
      <path
        fill="none"
        stroke="#2dd4bf"
        stroke-width="3.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M18.8 20.2 24.6 44.2 32 29.2 39.4 44.2 45.2 20.2"
      />
      <circle cx="32" cy="29.2" r="2.65" fill="#2dd4bf" />
    </g>
    <text
      y="36"
      text-anchor="middle"
      fill="#f6f7f9"
      font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
      font-size="16"
      font-weight="600"
      letter-spacing="-0.4"
    >High-quality code</text>
    <text
      y="56"
      text-anchor="middle"
      fill="#8e96a3"
      font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
      font-size="12"
    >The bar agents must clear</text>
  </g>

  <g font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif">
    <g transform="translate(168 152)">
      <circle r="7" fill="#12151c" stroke="#5eead4" stroke-width="2" />
      <text x="0" y="-18" text-anchor="middle" fill="#e8eaee" font-size="14" font-weight="500">Grill</text>
      <text x="0" y="28" text-anchor="middle" fill="#8e96a3" font-size="11">Kill bad ideas</text>
    </g>
    <g transform="translate(320 108)">
      <circle r="7" fill="#12151c" stroke="#5eead4" stroke-width="2" />
      <text x="0" y="-18" text-anchor="middle" fill="#e8eaee" font-size="14" font-weight="500">Spec</text>
      <text x="0" y="28" text-anchor="middle" fill="#8e96a3" font-size="11">Gherkin, not vibes</text>
    </g>
    <g transform="translate(470 88)">
      <rect x="-40" y="-16" width="80" height="32" rx="7" fill="#042f2e" stroke="#2dd4bf" stroke-width="2" />
      <text x="0" y="5" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="600">TDD</text>
      <text x="0" y="36" text-anchor="middle" fill="#8e96a3" font-size="11">One failing test</text>
    </g>
    <g transform="translate(640 88)">
      <rect x="-40" y="-16" width="80" height="32" rx="7" fill="#042f2e" stroke="#2dd4bf" stroke-width="2" />
      <text x="0" y="5" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="600">XFN</text>
      <text x="0" y="36" text-anchor="middle" fill="#8e96a3" font-size="11">a11y · E2E · security</text>
    </g>
    <text x="555" y="52" text-anchor="middle" fill="#2dd4bf" font-size="11" letter-spacing="0.14em" font-weight="600">THE BAR</text>
    <g transform="translate(800 108)">
      <circle r="7" fill="#12151c" stroke="#5eead4" stroke-width="2" />
      <text x="0" y="-18" text-anchor="middle" fill="#e8eaee" font-size="14" font-weight="500">Audit</text>
      <text x="0" y="28" text-anchor="middle" fill="#8e96a3" font-size="11">Boundaries</text>
    </g>
    <g transform="translate(980 152)">
      <circle r="7" fill="#12151c" stroke="#5eead4" stroke-width="2" />
      <text x="0" y="-18" text-anchor="middle" fill="#e8eaee" font-size="14" font-weight="500">Ship</text>
      <text x="0" y="28" text-anchor="middle" fill="#8e96a3" font-size="11">Release + align</text>
    </g>
  </g>

  <g font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif">
    <g transform="translate(980 370)">
      <text text-anchor="middle" fill="#2dd4bf" font-size="11" font-weight="600" letter-spacing="0.14em">LEARN</text>
      <text y="18" text-anchor="middle" fill="#e8eaee" font-size="13">Eval miss ? CI gate</text>
    </g>
    <g transform="translate(600 445)">
      <text text-anchor="middle" fill="#e8eaee" font-size="13">Quality loops ? Linear</text>
      <text y="18" text-anchor="middle" fill="#8e96a3" font-size="11">RUM · Lighthouse · Sonar · red checks</text>
    </g>
    <g transform="translate(220 370)">
      <text text-anchor="middle" fill="#e8eaee" font-size="13">Work picker</text>
      <text y="18" text-anchor="middle" fill="#8e96a3" font-size="11">Draft PRs, not folklore</text>
    </g>
  </g>
</svg>
