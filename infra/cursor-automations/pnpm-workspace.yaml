packages:
  - "."

allowBuilds:
  '@pulumi/cursor@file:sdks/cursor': true
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@isaacs/nonrecursive-glob-match@1.1.0'
  - minimatch@11.0.5

overrides:
  # GHSA-3g3m-2fjr-6pw4: an aborted glob walk kept reading the filesystem.
  "glob@>=9.0.0 <14.0.2": 14.0.3
  # GHSA-g3hv-75wg-m249: minimatch 10 has no in-range patch. Parents still declare ^10.
  'minimatch@10': 11.0.5
