name: "Routing: Waykit knowledge MCP"
dataset: "kit_knowledge.jsonl"
system_prompt: "kit_knowledge_prompt.md"
mcp_tools:
  - "tools/search_kit.json"
  - "tools/get_sop.json"
  - "tools/get_philosophy_section.json"
  - "tools/list_kit_index.json"
  - "tools/get_handover.json"
  - "tools/get_entity.json"
  - "tools/get_related.json"
metrics:
  - type: "tool_selection"
  - type: "schema_match"
    strict: true
  - type: "argument_correctness"
  - type: "mcp_use"
  - type: "task_completion"
mocks:
  - tool: "get_sop"
    response:
      id: "conventional-commits"
      path: "SOPs/conventional-commits.md"
  - tool: "search_kit"
    response:
      hits:
        - path: "CODING_PHILOSOPHY.md"
          excerpt: "Hexagonal architecture"
  - tool: "get_philosophy_section"
    response:
      id: "8"
      title: "Interaction Mandate"
  - tool: "list_kit_index"
    response:
      sops:
        - "conventional-commits"
  - tool: "get_handover"
    response:
      path: "handover/canvas/handover_spec.md"
      phase: "spec"
      status: "COMPLETE"
  - tool: "get_entity"
    response:
      id: "skill:agent-tdd"
      type: "Skill"
      name: "agent-tdd"
  - tool: "get_related"
    response:
      edges:
        - from: "skill:agent-tdd"
          relation: "uses"
          to: "mcp:context7"
        - from: "sop:conventional-commits"
          relation: "implements"
          to: "philosophy:8"
        - from: "sop:eval-driven-development"
          relation: "references"
          to: "doc:edd"
        - from: "subagent:agent-tdd"
          relation: "adapts"
          to: "skill:agent-tdd"
